<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vista previa del widget de radio</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      background: #0c151d;
      color: #f5f8fb;
    }

    .preview {
      width: min(100%, 980px);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.35rem;
    }

    p {
      margin: 0 0 18px;
      color: #afbeca;
      line-height: 1.5;
    }

    .preview__toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .preview__toolbar button {
      padding: 9px 14px;
      border: 1px solid rgba(142, 197, 255, 0.35);
      border-radius: 10px;
      background: #142838;
      color: #fff;
      cursor: pointer;
    }

    .preview__toolbar button.is-active {
      border-color: #ff7f77;
      box-shadow: 0 0 12px rgba(255, 127, 119, 0.22);
    }

    .preview__stage {
      overflow: auto;
      padding: 28px;
      border: 1px solid rgba(142, 197, 255, 0.16);
      border-radius: 18px;
      background: #101820;
    }

    .preview__frame-wrap {
      width: 470px;
      margin: 0 auto;
      transition: width 0.2s ease;
    }

    iframe {
      display: block;
      width: 100%;
      height: 820px;
      border: 0;
      background: #101820;
    }

    .preview__measure {
      margin-top: 10px;
      text-align: center;
      color: #8fa4b4;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <main class="preview">
    <h1>Prueba de ancho — Widget compacto</h1>
    <p>Esta página es solo para desarrollo. Cambia el ancho del contenedor sin modificar el reproductor ni crear otra lógica de audio.</p>

    <div class="preview__toolbar" aria-label="Anchos de prueba">
      <button type="button" data-width="320">320 px</button>
      <button type="button" data-width="360">360 px</button>
      <button type="button" data-width="400">400 px</button>
      <button type="button" data-width="470" class="is-active">470 px</button>
    </div>

    <section class="preview__stage">
      <div id="frameWrap" class="preview__frame-wrap">
        <iframe src="../index.html" title="Vista previa del widget compacto"></iframe>
      </div>
      <div id="measure" class="preview__measure">Ancho de prueba: 470 px</div>
    </section>
  </main>

  <script>
    const frameWrap = document.getElementById("frameWrap");
    const measure = document.getElementById("measure");
    const buttons = Array.from(document.querySelectorAll("[data-width]"));

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        const width = Number(button.dataset.width);
        frameWrap.style.width = `${width}px`;
        measure.textContent = `Ancho de prueba: ${width} px`;

        buttons.forEach((item) => item.classList.toggle("is-active", item === button));
      });
    });
  </script>
</body>
</html>
