<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alcatraz Radio FM</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="player" aria-label="Reproductor de Alcatraz Radio FM">
    <header class="player__header">
      <div>
        <h1>Alcatraz Radio FM</h1>
        <p>Transmisión en vivo</p>
      </div>
      <span class="live-badge">LIVE</span>
    </header>

    <audio
      id="radio"
      src="https://a8.my-control-panel.com:9360/radio.mp3"
      preload="none">
    </audio>

    <section class="controls" aria-label="Controles de reproducción">
      <button id="playButton" class="control-button control-button--primary" type="button" aria-label="Reproducir">
        ▶
      </button>

      <button id="muteButton" class="control-button" type="button" aria-label="Silenciar">
        🔊
      </button>

      <div class="volume-control">
        <label for="volumeControl">Volumen</label>
        <input
          id="volumeControl"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="0.80"
          aria-label="Volumen">
        <span id="volumeValue">80%</span>
      </div>
    </section>

    <p id="status" class="status" aria-live="polite">Radio detenida</p>
  </main>

  <script src="js/audio-engine.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
