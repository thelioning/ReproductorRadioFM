<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alcatraz Radio FM</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/visualizer.css">
</head>
<body>
  <main class="player" aria-label="Reproductor de Alcatraz Radio FM">
    <header class="player__header">
      <div>
        <h1>Alcatraz Radio FM</h1>
        <p>Transmisión en vivo</p>
      </div>
      <span class="live-badge">LIVE</span>
    </header>

    <audio id="radio" src="https://a8.my-control-panel.com:9360/radio.mp3" preload="none"></audio>

    <section class="brand-visualizer" aria-label="Visualizador de Alcatraz Radio FM">
      <svg id="brandVisualizer" viewBox="0 0 1200 190" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
        <defs>
          <linearGradient id="visualizerGradient" x1="40" y1="0" x2="1160" y2="0" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ff8a4c"></stop>
            <stop offset="0.43" stop-color="#ff7f77"></stop>
            <stop offset="1" stop-color="#bc74ee"></stop>
          </linearGradient>

          <clipPath id="brandTextClip">
            <text
              x="600"
              y="128"
              text-anchor="middle"
              textLength="1060"
              lengthAdjust="spacingAndGlyphs"
              font-family="Arial Black, Arial, Helvetica, sans-serif"
              font-size="112"
              font-weight="900"
            >ALCATRAZ RADIO FM</text>
          </clipPath>
        </defs>

        <g id="visualizerBaseBars" clip-path="url(#brandTextClip)"></g>
        <g id="visualizerGlowBars" clip-path="url(#brandTextClip)"></g>
        <g id="visualizerBars" clip-path="url(#brandTextClip)"></g>
        <g id="visualizerEdgeBars"></g>
      </svg>
    </section>

    <section class="controls" aria-label="Controles de reproducción">
      <button id="playButton" class="play-button" type="button" aria-label="Reproducir">
        <span class="play-button__icon play-button__icon--play" aria-hidden="true"></span>
        <span class="play-button__icon play-button__icon--pause" aria-hidden="true"></span>
      </button>

      <div class="volume-group">
        <button id="muteButton" class="volume-button" type="button" aria-label="Silenciar">
          <svg class="volume-icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <path class="volume-icon__speaker" d="M10 20h7l9-8v24l-9-8h-7z"></path>
            <path class="volume-icon__wave volume-icon__wave--small" d="M30 19c2 1.4 3 3 3 5s-1 3.6-3 5"></path>
            <path class="volume-icon__wave volume-icon__wave--large" d="M34 14c4 2.6 6 6 6 10s-2 7.4-6 10"></path>
            <path class="volume-icon__mute" d="M31 18l10 12M41 18L31 30"></path>
          </svg>
        </button>

        <div class="volume-control">
          <div class="volume-control__header">
            <label for="volumeControl">Volumen</label>
            <span id="volumeValue">80%</span>
          </div>
          <input id="volumeControl" type="range" min="0" max="1" step="0.01" value="0.80" aria-label="Volumen">
        </div>
      </div>
    </section>

    <p id="status" class="status" aria-live="polite">Radio detenida</p>
    <p id="audioDebug" class="audio-debug" aria-live="polite"></p>
  </main>

  <script src="js/audio-engine.js"></script>
  <script src="js/player.js"></script>
  <script src="js/visualizer.js"></script>
</body>
</html>
